services:
  # 本地 IMAP 演示服务（纯 Python 标准库实现，支持删信/断流/重建注入）
  imap:
    build: ./imap_server
    environment:
      MAIL_DATA_DIR: /maildata
      IMAP_BIND_HOST: "0.0.0.0"
      IMAP_BIND_PORT: "143"
      IMAP_USER: "invoicing@example.com"
      IMAP_PASSWORD: "invoice-pass"
      LOG_LEVEL: "INFO"
    volumes:
      - maildata:/maildata
    ports:
      - "1430:143"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',143),3); d=s.recv(64); s.close(); sys.exit(0 if d.startswith(b'* OK') else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 一次性播种任务：IMAP 就绪后写入 5 封演示邮件，成功后退出
  imap-seed:
    build: ./imap_server
    depends_on:
      imap:
        condition: service_healthy
    environment:
      MAIL_DATA_DIR: /maildata
    volumes:
      - maildata:/maildata
    # 用 sh -c 包裹：镜像 CMD 即使被当作多余参数传入也会被忽略
    entrypoint: ["/bin/sh", "-c", "exec python -m imapdemo.seed --data-dir /maildata"]
    restart: "no"

  # 一次性密钥任务：在独立密钥卷中生成 AES-256 密钥（已存在则不动）
  keygen:
    build: ./collector
    entrypoint: ["/bin/sh", "-c", "exec python -m app.keygen --path /secrets/blob.key"]
    volumes:
      - blobkey:/secrets
    restart: "no"

  # FastAPI + SQLite 采集/迁移服务，/docs 提供全部 API
  collector:
    build: ./collector
    depends_on:
      imap:
        condition: service_healthy
      imap-seed:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
    environment:
      IMAP_HOST: "imap"
      IMAP_PORT: "143"
      IMAP_USER: "invoicing@example.com"
      IMAP_PASSWORD: "invoice-pass"
      IMAP_MAILBOX: "INBOX"
      IMAP_SOCKET_TIMEOUT: "30"
      MAX_MESSAGE_BYTES: "8388608"  # 8 MiB
      DATA_DIR: "/data"
      # 密钥在数据卷之外的独立卷，collector 只读挂载
      BLOB_KEY_FILE: "/secrets/blob.key"
      MIGRATION_AUTO_RESUME: "1"
      MIGRATION_ALLOW_DEMO_FAULT: "1"
    volumes:
      - collectordata:/data
      - blobkey:/secrets:ro
    ports:
      - "8000:8000"
    # 迁移演示会主动退出进程：always 策略负责拉起，启动时自动续办未完成迁移
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  maildata:
  collectordata:
  blobkey:
